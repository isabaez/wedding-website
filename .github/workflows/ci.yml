# Lint and build every pull request into develop and every push to beta, so a change that breaks the static
# export is caught before the [ production deploy ] PR. Actions are pinned to full commit SHAs, which Dependabot bumps.
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [beta]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check that every page was exported
        run: |
          for page in index information italy gallery registry rsvp; do
            test -f "out/$page.html" || { echo "::error::out/$page.html is missing"; exit 1; }
          done
